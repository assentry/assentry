<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>HAPI — Personal App (prototype)</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
    h1 { font-size: 1.3rem; }
    section { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 20px; }
    label { display: block; font-size: 0.85rem; margin-top: 8px; color: #555; }
    input, select { width: 100%; padding: 6px; margin-top: 2px; box-sizing: border-box; }
    button { margin-top: 12px; padding: 8px 14px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.85rem; }
    td, th { text-align: left; padding: 4px 6px; border-bottom: 1px solid #eee; }
    .hidden { display: none; }
    .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 0.75rem; }
    .pill.allowed { background: #dcf5df; color: #1a7a2e; }
    .pill.denied { background: #fbdcdc; color: #a3231f; }
    pre { background: #f6f6f6; padding: 8px; overflow-x: auto; font-size: 0.8rem; }
  </style>
</head>
<body>
  <h1>HAPI — prototype control plane</h1>

  <section id="auth-section">
    <h2>1. Identity</h2>
    <label>Email <input id="email" type="email" value="you@example.com" /></label>
    <label>Password <input id="password" type="password" value="password123" /></label>
    <button onclick="signup()">Sign up</button>
    <button onclick="login()">Log in</button>
    <div id="auth-status"></div>
  </section>

  <div id="app" class="hidden">
    <section>
      <h2>2. Connect an agent</h2>
      <label>Platform
        <select id="platform">
          <option value="claude">Claude</option>
          <option value="chatgpt">ChatGPT</option>
          <option value="grok">Grok</option>
          <option value="other">Other</option>
        </select>
      </label>
      <label>Label <input id="agent-label" placeholder="My job-search assistant" /></label>
      <button onclick="connectAgent()">Connect</button>
      <table id="agents-table"><thead><tr><th>Platform</th><th>Label</th><th>Status</th><th></th></tr></thead><tbody></tbody></table>
    </section>

    <section>
      <h2>3. Authorise (consent)</h2>
      <label>Agent
        <select id="grant-agent"></select>
      </label>
      <label>Scope <input id="grant-scope" value="job_application:submit" /></label>
      <label>Consented fields (comma-separated) <input id="grant-fields" value="name,email,resume" /></label>
      <label>Expires in (minutes) <input id="grant-minutes" type="number" value="60" /></label>
      <button onclick="createGrant()">Authorise</button>
      <div id="credential-output"></div>
      <table id="grants-table"><thead><tr><th>Scope</th><th>Expires</th><th>Status</th><th></th></tr></thead><tbody></tbody></table>
    </section>

    <section>
      <h2>4. Activity / audit log</h2>
      <button onclick="loadAudit()">Refresh</button>
      <table id="audit-table"><thead><tr><th>When</th><th>Action</th><th>Result</th><th>Reason</th><th>Partner</th></tr></thead><tbody></tbody></table>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
