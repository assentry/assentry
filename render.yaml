databases:
  - name: hapi-db
    plan: free
    databaseName: hapi
    user: hapi

services:
  - type: web
    name: hapi-backend
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run add-scope -- dashboard:read && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hapi-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: hapi-frontend
    runtime: node
    plan: free
    buildCommand: cd frontend && npm install --include=dev && npm run build
    startCommand: cd frontend && npm start
    envVars:
      # The personal app + marketing site now live on their own origin and
      # talk to hapi-backend over HTTP (CORS-open, Bearer-token auth) — set
      # this to hapi-backend's public Render URL after its first deploy.
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false

  - type: web
    name: hapi-demo-job-board
    runtime: node
    plan: free
    buildCommand: cd examples/demo-job-board && npm install --include=dev && npm run build
    startCommand: node examples/demo-job-board/dist/index.js
    envVars:
      # Set these three after hapi-backend's first deploy: HAPI_BASE_URL is
      # its public Render URL, HAPI_API_KEY and HAPI_PARTNER_PUBLIC_ID come
      # from running `npm run seed:partner` against the deployed database.
      - key: HAPI_BASE_URL
        sync: false
      - key: HAPI_API_KEY
        sync: false
      - key: HAPI_PARTNER_PUBLIC_ID
        sync: false
