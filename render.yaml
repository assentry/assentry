databases:
  - name: assentry-db
    plan: free
    databaseName: assentry
    user: assentry

services:
  - type: web
    name: assentry-backend
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: assentry-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: assentry-frontend
    runtime: node
    plan: free
    buildCommand: cd frontend && npm install --include=dev && npm run build
    startCommand: cd frontend && npm start
    envVars:
      # The personal app + marketing site now live on their own origin and
      # talk to assentry-backend over HTTP (CORS-open, Bearer-token auth) — set
      # this to assentry-backend's public Render URL after its first deploy.
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false

  - type: web
    name: assentry-demo-site
    runtime: node
    plan: free
    buildCommand: cd examples/demo-site && npm install --include=dev && npm run build
    startCommand: node examples/demo-site/dist/index.js
    envVars:
      # Set these three after assentry-backend's first deploy: ASSENTRY_BASE_URL is
      # its public Render URL, ASSENTRY_API_KEY and ASSENTRY_PARTNER_PUBLIC_ID come
      # from running `npm run seed:partner` against the deployed database.
      - key: ASSENTRY_BASE_URL
        sync: false
      - key: ASSENTRY_API_KEY
        sync: false
      - key: ASSENTRY_PARTNER_PUBLIC_ID
        sync: false
