databases:
  - name: assentry-db
    plan: free
    databaseName: assentry
    user: assentry

services:
  - type: web
    name: assentry-backend
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: assentry-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Assentry's public API address: used for the agent connector's OAuth
      # addresses, file download links and local upload links.
      - key: PUBLIC_BASE_URL
        value: https://api.assentry.io

  - type: web
    name: assentry-frontend
    runtime: node
    plan: free
    buildCommand: cd frontend && npm install --include=dev && npm run build
    startCommand: cd frontend && npm start
    envVars:
      # The site (assentry.io) talks to the API at api.assentry.io over HTTP
      # (CORS-open, Bearer-token auth). Baked in at build time.
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://api.assentry.io
